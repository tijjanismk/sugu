<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Button — aperçu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap">
<style></style>
</head>
<body>

<div class="sg-stage">
  <button class="sg-btn sg-btn--primary" type="button">Publier l'annonce</button>
  <button class="sg-btn sg-btn--sun" type="button"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M12 5v14M5 12h14"/></svg>Déposer une annonce</button>
  <button class="sg-btn" type="button">Modifier</button>
  <button class="sg-btn sg-btn--quiet" type="button">Tout voir</button>
  <button class="sg-btn sg-btn--danger" type="button">Supprimer l'annonce</button>
  <button class="sg-btn sg-btn--icon" type="button" aria-label="Rechercher"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
</div>
<div class="sg-stage">
  <button class="sg-btn sg-btn--primary" type="button" aria-disabled="true"><span class="sg-spinner" aria-hidden="true"></span>Publication…</button>
  <button class="sg-btn sg-btn--primary" type="button" disabled>Publier l'annonce</button>
</div>
<div class="sg-stage sg-stage--col" style="max-width:360px">
  <button class="sg-btn sg-btn--primary sg-btn--lg sg-btn--block" type="button"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>Appeler le vendeur</button>
</div>
</body>
</html>
