<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PhotoPicker — aperçu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap">
<style></style>
</head>
<body>

<div class="sg-phone">
<div class="sg-field" style="padding-bottom:0"><span class="sg-field__label">Photos <small>(1 à 6)</small></span></div>
<div class="sg-photos">
  <div class="sg-photo"><svg class="sg-icon sg-icon--lg" viewBox="0 0 24 24" aria-hidden="true" ><path d="M4 8h3l2-3h6l2 3h3v12H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="sg-photo__cover">Couverture</span><button class="sg-photo__remove" type="button" aria-label="Retirer la photo"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sg-photo"><svg class="sg-icon sg-icon--lg" viewBox="0 0 24 24" aria-hidden="true" ><path d="M4 8h3l2-3h6l2 3h3v12H4Z"/><circle cx="12" cy="13" r="3.5"/></svg><button class="sg-photo__remove" type="button" aria-label="Retirer la photo"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <button class="sg-photo--add" type="button"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M12 5v14M5 12h14"/></svg>Ajouter</button>
</div>
<div class="sg-field" style="padding-top:0"><span class="sg-field__help">La première photo est la couverture. Prenez-la en plein jour, sur fond simple.</span></div>
</div>
</body>
</html>
