<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MessageBubble — aperçu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&display=swap">
<style></style>
</head>
<body>

<div class="sg-phone">
<div class="sg-thread">
  <span class="sg-thread__day">Aujourd'hui</span>
  <div class="sg-msg">Bonjour, le vélo est-il toujours disponible ?<span class="sg-msg__time">10:12</span></div>
  <div class="sg-msg sg-msg--me">Oui, il est disponible. Vous pouvez venir le voir à Hamdallaye cet après-midi.<span class="sg-msg__time">10:15 <svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m2 12 5 5L17 7M22 7l-9 10"/></svg></span></div>
  <div class="sg-msg">Est-ce que 40 000 vous irait ?<span class="sg-msg__time">10:20</span></div>
  <div class="sg-msg sg-msg--me">42 000 et je le livre.<span class="sg-msg__time">10:21 <svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m5 12 5 5L20 7"/></svg></span></div>
</div>
<form class="sg-composer">
  <input class="sg-input" type="text" placeholder="Écrire un message" aria-label="Message">
  <button class="sg-btn sg-btn--primary sg-btn--icon" type="submit" aria-label="Envoyer"><svg class="sg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8Z"/></svg></button>
</form>
</div>
</body>
</html>
