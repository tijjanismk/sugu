services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: sugu
      POSTGRES_USER: sugu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ : le volume se monte sur /var/lib/postgresql
      # (et non plus /var/lib/postgresql/data comme pour les versions <= 17)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugu"]
      interval: 10s
      retries: 5

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
