<!doctype html>
<html lang="fr">
<body style="margin:0;padding:24px 16px;background:#f6f4ee;font-family:Arial,Helvetica,sans-serif;color:#1a1b33;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #dbd6cb;border-radius:16px;padding:24px;">
    <p style="margin:0 0 16px;font-size:24px;font-weight:800;color:#2b3c8e;">Sugu</p>
    <p style="margin:0 0 8px;font-size:16px;">Bonjour {{ recipient }},</p>
    <p style="margin:0 0 24px;font-size:16px;line-height:24px;"><strong>{{ sender }}</strong> vous a écrit à propos de « {{ listing_title }} ».</p>
    <a href="{{ conversation_url }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#2b3c8e;color:#ffffff;font-weight:700;text-decoration:none;">Lire et répondre</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:18px;color:#5c5e78;">Rencontrez-vous dans un lieu public et ne payez jamais avant d'avoir vu l'objet.</p>
    <p style="margin:12px 0 0;font-size:13px;line-height:18px;color:#5c5e78;">Un seul email par conversation tant que vous ne l'avez pas ouverte. <a href="{{ profile_url }}" style="color:#2b3c8e;">Ne plus recevoir ces emails</a></p>
  </div>
</body>
</html>
